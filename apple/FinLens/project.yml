name: FinLens
packages:
  FinLensCore:
    path: ../FinLensCore

options:
  bundleIdPrefix: com.finlens
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  FinLens:
    type: application
    platform: [iOS, macOS]
    sources:
      - Sources
      - Resources
    dependencies:
      - package: FinLensCore
    settings:
      base:
        PRODUCT_NAME: FinLens
        PRODUCT_BUNDLE_IDENTIFIER: com.finlens.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "FinLens AI"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 FinLens AI. All rights reserved."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "FinLens AI connects to your private FinLens backend for secure financial intelligence."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": "Resources/FinLens_macOS.entitlements"
        ENABLE_HARDENED_RUNTIME: YES
