services:
  db:
    image: postgres:16-alpine
    container_name: finlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finlens_user
      POSTGRES_PASSWORD: finlens_password
      POSTGRES_DB: finlens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlens_user -d finlens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
